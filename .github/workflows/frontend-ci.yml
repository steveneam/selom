# Frontend CI — lint + typecheck + unit tests + a real `next build` on every PR/push
# touching app/frontend. The build step is deliberately included: it's the only thing
# that catches SSR/integration breaks before they hit Vercel (memory:
# full-app-smoke-test-before-handoff — a raw `import("plotly.js")` once 500'd every page).
# Vercel still does its own build on deploy; this gives a pre-merge signal.
name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: app/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install (react-plotly.js stale peer-deps → --legacy-peer-deps)
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build (catches SSR/integration breaks)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
