# Alembic config — relational-store migrations (AWS materialization step 2+).
# The database URL is NOT set here; alembic/env.py reads it from config.settings
# (SELOM_DATABASE_URL), so dev (SQLite) and prod (Aurora) share one migration set.
# Usage: from app/backend, `alembic upgrade head` (with SELOM_DATABASE_URL set), or
# pass one inline: `alembic -x url=sqlite:///dev.db upgrade head`.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
