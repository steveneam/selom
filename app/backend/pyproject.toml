# Selom backend dependencies.
# Default `uv sync` installs the LIGHT core only (FastAPI + Plotly + numeric base) so
# the skeleton runs the offline stub skills with zero heavy deps.
# Run `uv sync --extra scrna` for the scRNA path (scanpy + leiden) — enough for the P0
#   hello-UMAP and the scRNA/bulk skills, WITHOUT pulling scvi-tools/PyTorch.
# Run `uv sync --extra omics` for the full heavy stack (adds scvi-tools, proteomics,
#   Kaleido export) needed by later buckets (trajectory, proteomics, journal export).

[project]
name = "selom-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.136.3",
  "uvicorn[standard]>=0.49.0",
  "pydantic>=2.13",
  "pydantic-settings>=2",
  "plotly>=6.8",
  "numpy>=2.4",
  "pandas>=3.0",
  "scipy",
  # BSD, already pulled transitively by scanpy. Explicit here for the license-clean
  # primitives the skills use directly: clustering-quality guardrails (silhouette),
  # hierarchical linkage (heatmap row-ordering), PCA/NMF/t-SNE.
  "scikit-learn",
  # MIT — pandas' .xlsx reader. Real bulk omics tables (counts, DE results, gene lists)
  # ship as Excel as often as CSV; this lets every skill read .xlsx without the heavy stack.
  "openpyxl",
]

[project.optional-dependencies]
# Light scRNA path — enough for the P0 hello-UMAP (UMAP / cluster / DEG). No scvi-tools/torch.
# scanpy already pulls umap-learn, pynndescent, numba and scikit-learn; leiden needs leidenalg+igraph.
scrna = [
  "scanpy>=1.12",
  "anndata>=0.12,<0.13",
  "leidenalg>=0.10",
  "igraph>=0.11",
  # BSD-3 — the standalone `ppt` principal-tree engine from scFates (clean deps: numba/
  # scipy/igraph), used by the trajectory skill to draw smooth Slingshot-style lineage
  # curves. Avoids scFates itself (pulls GPL elpigraph-python) and R-only Slingshot.
  "simpleppt>=1.1",
]
# Journal figure export (B4): Kaleido v1 (github.com/plotly/Kaleido) rasterizes a Plotly
# spec to PNG/SVG/PDF by driving the SYSTEM Chrome over CDP — pure-Python, no bundled
# Chromium, no container at runtime. Deliberately split out of the heavy `omics` extra so
# export works on a `uv sync --extra export` without pulling scvi-tools/PyTorch. The Linux
# deploy image still needs a browser installed (RISKS #2 — a B8 deploy concern, not this one).
export = [
  "kaleido>=1.3",
]
# Paper reader (papers.py — the "extract skills from papers" intake): turn a deposited
# paper PDF into text (methods / figure legends / GEO accessions) + rasterized pages &
# embedded figures. Permissive-only (shipped path), AVOIDS PyMuPDF/fitz (AGPL):
#   pypdf      BSD-3-Clause — text, metadata, embedded-image bytes
#   pypdfium2  BSD-3-Clause/Apache-2.0 (wraps Google PDFium, BSD-3) — full-page rasterize
#   pillow     HPND (MIT/BSD-like) — PNG encode of the rasterized pages
pdf = [
  "pypdf>=5",
  "pypdfium2>=4",
  "pillow>=10",
]
# Full heavy stack (superset of scrna): adds scvi-tools/PyTorch, proteomics, and Kaleido export
# for later buckets (trajectory, proteomics volcano, journal-preset export). Multi-GB install.
#
# NOTE — OmicVerse is intentionally NOT here. It's a high-value target (a second Verified
# engine + the primary Skill-Foundry source: ov.pp / ov.bulk / ov.single / ov.pl over
# AnnData), but its pins (pandas<3.0, scipy<1.12, anndata<0.12) are INCOMPATIBLE with this
# backend's deliberate pandas>=3.0 + anndata>=0.12 stack — adding it makes `uv` unsolvable.
# Integration path: run OmicVerse in an ISOLATED worker/env (its own venv or container, the
# §6.5C/E per-skill-env model) and call it out-of-process; do NOT downgrade the main stack.
# Tracked: RISKS #9, plans/v2-backend.md backlog, docs/integrations.md.
# SCA: `gseapy` was DROPPED at B3 because enrichment uses an in-house hypergeometric ORA
# (DECISIONS #9) — it was simply unused, NOT an "AGPL surface" (corrected 2026-06-16:
# gseapy is BSD-3, not AGPL — the old note conflated gseapy=code with MSigDB=restricted
# data; RISKS #6 / #9). gseapy.prerank (BSD-3) + blitzgsea (Apache-2.0) are now allowed
# GSEA engines over our from-GO library and may be re-added here for the Fig5/6 GSEA work.
# `decoupler` is still listed for later pathway work; re-check its license at the pre-launch SCA gate.
omics = [
  "selom-backend[scrna]",
  "selom-backend[export]",
  "scvi-tools>=1.4.3",
  "decoupler",
  "pydeseq2>=0.5.4",
  "alphastats",
  "pyteomics",
  "statsmodels",
  # GSEA engines for the `gsea` skill, over Selom's own license-clean GO library (NOT MSigDB).
  # Both permissive (DECISIONS #9, corrected 2026-06-16): gseapy = BSD-3 (exposes the running
  # ES curve), blitzgsea = Apache-2.0 (gamma-fit p-values, closest to fgsea). In-house
  # weighted-KS stays as the zero-extra-dep fallback.
  "gseapy>=1.1",
  "blitzgsea>=1.3",
]
# Async job path (B3): arq + Redis queue (DECISIONS #6) + boto3 for the R2 result
# store. OPTIONAL — the default inline executor + local-filesystem result store need
# NONE of these, so `uv sync` (core) runs the full job API offline. boto3 >=1.36 needs
# the R2 checksum workaround, applied in storage/results.py (RISKS #5).
jobs = [
  "arq>=0.25",
  "redis>=5",
  "boto3>=1.36",
]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
