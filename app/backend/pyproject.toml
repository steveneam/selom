# Selom backend dependencies.
# Default `uv sync` installs the LIGHT core only (FastAPI + Plotly + numeric base) so
# the skeleton runs the offline stub skills with zero heavy deps.
# Run `uv sync --extra scrna` for the scRNA path (scanpy + leiden) — enough for the P0
#   hello-UMAP and the scRNA/bulk skills, WITHOUT pulling scvi-tools/PyTorch.
# Run `uv sync --extra omics` for the full heavy stack (adds scvi-tools, proteomics,
#   Kaleido export) needed by later buckets (trajectory, proteomics, journal export).

[project]
name = "selom-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.136.3",
  "uvicorn[standard]>=0.49.0",
  "pydantic>=2.13",
  "pydantic-settings>=2",
  "plotly>=6.8",
  "numpy>=2.4",
  "pandas>=3.0",
  "scipy",
  # BSD, already pulled transitively by scanpy. Explicit here for the license-clean
  # primitives the skills use directly: clustering-quality guardrails (silhouette),
  # hierarchical linkage (heatmap row-ordering), PCA/NMF/t-SNE.
  "scikit-learn",
  # MIT — pandas' .xlsx reader. Real bulk omics tables (counts, DE results, gene lists)
  # ship as Excel as often as CSV; this lets every skill read .xlsx without the heavy stack.
  "openpyxl",
]

[project.optional-dependencies]
# Light scRNA path — enough for the P0 hello-UMAP (UMAP / cluster / DEG). No scvi-tools/torch.
# scanpy already pulls umap-learn, pynndescent, numba and scikit-learn; leiden needs leidenalg+igraph.
scrna = [
  "scanpy>=1.12",
  "anndata>=0.12,<0.13",
  "leidenalg>=0.10",
  "igraph>=0.11",
]
# Full heavy stack (superset of scrna): adds scvi-tools/PyTorch, proteomics, and Kaleido export
# for later buckets (trajectory, proteomics volcano, journal-preset export). Multi-GB install.
#
# NOTE — OmicVerse is intentionally NOT here. It's a high-value target (a second Verified
# engine + the primary Skill-Foundry source: ov.pp / ov.bulk / ov.single / ov.pl over
# AnnData), but its pins (pandas<3.0, scipy<1.12, anndata<0.12) are INCOMPATIBLE with this
# backend's deliberate pandas>=3.0 + anndata>=0.12 stack — adding it makes `uv` unsolvable.
# Integration path: run OmicVerse in an ISOLATED worker/env (its own venv or container, the
# §6.5C/E per-skill-env model) and call it out-of-process; do NOT downgrade the main stack.
# Tracked: RISKS #9, plans/v2-backend.md backlog, docs/integrations.md.
# SCA: `gseapy` was DROPPED — enrichment uses an in-house hypergeometric ORA
# (DECISIONS #9), so gseapy was unused AGPL surface (RISKS #6 / #9). `decoupler` is still
# listed for later pathway work; re-check its license at the pre-launch SCA gate.
omics = [
  "selom-backend[scrna]",
  "scvi-tools>=1.4.3",
  "decoupler",
  "pydeseq2>=0.5.4",
  "alphastats",
  "pyteomics",
  "statsmodels",
  "kaleido>=1.3",
]
# Async job path (B3): arq + Redis queue (DECISIONS #6) + boto3 for the R2 result
# store. OPTIONAL — the default inline executor + local-filesystem result store need
# NONE of these, so `uv sync` (core) runs the full job API offline. boto3 >=1.36 needs
# the R2 checksum workaround, applied in storage/results.py (RISKS #5).
jobs = [
  "arq>=0.25",
  "redis>=5",
  "boto3>=1.36",
]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
