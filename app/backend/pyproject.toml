# Selom backend dependencies.
# Default `uv sync` installs the LIGHT core only (FastAPI + Plotly + numeric base) so
# the skeleton runs the offline stub skills with zero heavy deps.
# Run `uv sync --extra omics` to pull the heavy scverse stack and enable the REAL scanpy skills.

[project]
name = "selom-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.136.3",
  "uvicorn[standard]>=0.49.0",
  "pydantic>=2.13",
  "pydantic-settings>=2",
  "plotly>=6.8",
  "numpy>=2.4",
  "pandas>=3.0",
  "scipy",
]

[project.optional-dependencies]
omics = [
  "scanpy>=1.12",
  "anndata>=0.12,<0.13",
  "scvi-tools>=1.4.3",
  "decoupler",
  "pydeseq2>=0.5.4",
  "gseapy",
  "alphastats",
  "pyteomics",
  "statsmodels",
  "scikit-learn",
  "kaleido>=1.3",
]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
